items:
  - name: "Steve Spurrier-Florida Field"
    photo: "assets/Buildings/ben-hill-griffin.jpg"
    tag: "Steve Spurrier-Florida Field &middot; The Swamp &middot; 88,548 Seats"
    description: "The playing surface at The Swamp is named after Steve Spurrier - ATO's most famous alumnus and the only person in history to win both a Heisman Trophy and a national championship as head coach at the same university. The stadium itself is named for Ben Hill Griffin Jr., another ATO alumnus and one of UF's most significant donors."
    featured: true

  - name: "Stephen C. O'Connell Center"
    photo: "assets/Buildings/oconnell-center.jpg"
    tag: "The O'Dome"
    description: "Named for former UF President and Florida Supreme Court Chief Justice Stephen C. O'Connell, an Alpha Omega brother. The O'Dome hosts basketball, gymnastics, concerts, and major campus events."
    featured: false

  - name: "George Smathers Libraries"
    photo: "assets/Buildings/smathers-library.jpg"
    tag: "UF Library System"
    description: "The university's library system is named for George Smathers, a long-serving U.S. Senator from Florida and ATO alumnus who represented the state for 18 years in Washington."
    featured: false

  - name: "Lawton Chiles Legal Information Center"
    photo: "assets/Buildings/chiles-legal-center.jpg"
    tag: "Levin College of Law"
    description: "Located within the Levin College of Law, named for Lawton Chiles, U.S. Senator and 41st Governor of Florida. A member of the Alpha Omega chapter."
    featured: false

  - name: "James G. Pressly Stadium"
    photo: "assets/Buildings/pressly-stadium.jpg"
    tag: "Soccer &amp; Track"
    description: "Home of the Florida Gators women's soccer and track &amp; field teams. Named in 2004 after James Pressly, a UF Law graduate and ATO alumnus, following a major gift to the athletic program."
    featured: false

  - name: "Katie Seashole Pressly Softball Stadium"
    photo: "assets/Buildings/pressly-softball.jpg"
    tag: "Gator Softball"
    description: "Named after the wife of ATO alumnus Jamie Pressly. A major gift in 2007 led to renovations that made it one of the premier softball venues in the country."
    featured: false
