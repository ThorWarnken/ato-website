backend:
  name: github
  repo: ThorWarnken/ato-website
  branch: main
  auth_type: pkce
  app_id: "Ov23li1CXAKcWko9MdmN"

media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "content"
    label: "Section Content"
    files:
      - name: "stats"
        label: "Chapter Stats"
        file: "_data/stats.yml"
        fields:
          - label: "Stats"
            name: "items"
            widget: "list"
            fields:
              - { label: "Number", name: "number", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }

      - name: "philanthropy_stats"
        label: "Philanthropy Stats"
        file: "_data/philanthropy_stats.yml"
        fields:
          - label: "Stats"
            name: "items"
            widget: "list"
            fields:
              - { label: "Number", name: "number", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }

      - name: "benefits"
        label: "ATO For Life Benefits"
        file: "_data/benefits.yml"
        fields:
          - label: "Benefits"
            name: "items"
            widget: "list"
            fields:
              - { label: "Number", name: "number", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

  - name: "galleries"
    label: "Photo Galleries"
    files:
      - name: "galleries"
        label: "All Galleries"
        file: "_data/galleries.yml"
        fields:
          - label: "Brotherhood Photos"
            name: "brotherhood"
            widget: "list"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string" }
          - label: "Philanthropy Photos"
            name: "philanthropy"
            widget: "list"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string" }
          - label: "Career Featured Image"
            name: "career_featured"
            widget: "object"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string" }
          - label: "Career Portrait Photos"
            name: "career"
            widget: "list"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string" }
          - label: "Social Photos"
            name: "social"
            widget: "list"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string" }

      - name: "carousel"
        label: "ATO For Life Carousel"
        file: "_data/carousel.yml"
        fields:
          - label: "Slides"
            name: "items"
            widget: "list"
            fields:
              - { label: "Photo", name: "photo", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string" }
              - { label: "Year / Location", name: "year", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

  - name: "alumni"
    label: "Alumni"
    files:
      - name: "legends"
        label: "Alumni Legends"
        file: "_data/alumni_legends.yml"
        fields:
          - label: "Legends"
            name: "items"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image" }
              - { label: "Photo Position (CSS)", name: "photo_position", widget: "string", default: "center center", required: false }
              - { label: "Badge Text", name: "badge", widget: "string" }
              - { label: "Title", name: "title", widget: "text" }
              - { label: "Bio", name: "bio", widget: "text", required: false }
              - { label: "Hero Featured", name: "featured", widget: "boolean", default: false }
              - { label: "Row (0=top, 1=middle, 2=bottom)", name: "row", widget: "number", default: 1 }

      - name: "prominent"
        label: "Prominent Alumni"
        file: "_data/alumni_prominent.yml"
        fields:
          - label: "Alumni"
            name: "items"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image" }
              - { label: "Photo Position (CSS)", name: "photo_position", widget: "string", default: "center 20%", required: false }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Bio", name: "bio", widget: "text" }

      - name: "campus_legacy"
        label: "Campus Legacy (Buildings)"
        file: "_data/alumni_campus_legacy.yml"
        fields:
          - label: "Buildings"
            name: "items"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image" }
              - { label: "Tag Line", name: "tag", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Featured (hero size)", name: "featured", widget: "boolean", default: false }

  - name: "people"
    label: "People"
    files:
      - name: "exec_board"
        label: "Executive Board"
        file: "_data/exec_board.yml"
        fields:
          - label: "Officers"
            name: "items"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image", required: false }
              - { label: "Photo Position (CSS)", name: "photo_position", widget: "string", default: "center 15%", required: false }
              - { label: "Initials (if no photo)", name: "initials", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string", required: false }
              - { label: "Phone Link (tel format)", name: "phone_link", widget: "string", required: false }
              - { label: "Instagram Handle", name: "instagram", widget: "string", required: false }
              - { label: "Featured (President)", name: "featured", widget: "boolean", default: false }

      - name: "bot_roster"
        label: "Board of Trustees"
        file: "_data/bot_roster.yml"
        fields:
          - label: "Members"
            name: "items"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Class Year", name: "class_year", widget: "string" }
              - { label: "Company / Title", name: "company", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image", required: false }
              - { label: "Photo Position (CSS)", name: "photo_position", widget: "string", required: false }
              - { label: "Initials (if no photo)", name: "initials", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string", required: false }
              - { label: "Phone Link (tel format)", name: "phone_link", widget: "string", required: false }
              - { label: "Chairman", name: "chairman", widget: "boolean", default: false }
