  <!-- ========================================
       SOCIAL SECTION
       ======================================== -->
  <section class="section bg-dark" id="social" style="color: rgba(255,255,255,0.85);">
    <div class="container">
      <div class="gallery-intro fade-in">
        <span class="section-label" style="color:var(--ato-gold);">Social</span>
        <h2 class="section-heading" style="color:var(--ato-white);"><em style="color:var(--ato-gold);">Social</em> Events</h2>
        <div class="section-divider" style="margin-left:auto;margin-right:auto;"></div>
        <p class="section-body" style="text-align:center;margin:0 auto;color:rgba(255,255,255,0.6);">We host some of the biggest events on campus every semester.</p>
      </div>

      <div class="photo-grid social-grid fade-in">
        {% for photo in site.data.galleries.social %}
        <div class="photo-item" data-lightbox>
          <img src="{{ photo.src }}" alt="{{ photo.alt }}" loading="lazy" decoding="async">
        </div>
        {% endfor %}
      </div>
    </div>
  </section>
